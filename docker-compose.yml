services:
  # Development service
  parsun-portal-web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: parsun-portal-web-dev
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://parsun-api-app:8080
    profiles:
      - dev
    restart: unless-stopped
    networks:
      - parsun-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Production service
  parsun-portal-web-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parsun-portal-web-prod
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    profiles:
      - prod
    restart: unless-stopped

networks:
  parsun-network:
    external: true
    name: parsun-api_parsun-network
