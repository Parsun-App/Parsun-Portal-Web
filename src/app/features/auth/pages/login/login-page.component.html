<div class="min-h-screen flex items-center justify-center bg-app-bg-primary">
  <div class="w-full max-w-md p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold">Parsun</h1>
      <p class="text-surface-500 mt-2">Portal de Clientes</p>
    </div>

    <div class="bg-surface-0 dark:bg-surface-800 rounded-xl shadow-sm p-6">
      @if (error()) {
        <div class="mb-4 p-3 bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-300 rounded-lg text-sm">
          {{ error() }}
        </div>
      }

      <div class="flex flex-col gap-4">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300" for="rif">RIF</label>
        <input
          id="rif"
          pInputText
          [ngModel]="rif()"
          (ngModelChange)="rif.set($event)"
          placeholder="J-12345678-9"
          class="w-full"
        />

        <label class="text-sm font-medium text-surface-700 dark:text-surface-300" for="password">Contraseña</label>
        <input
          id="password"
          pInputText
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          placeholder="••••••••"
          class="w-full"
          (keyup.enter)="login()"
        />

        <p-button
          label="Iniciar Sesión"
          [loading]="loading()"
          (click)="login()"
          styleClass="w-full"
        />
      </div>
    </div>
  </div>
</div>
