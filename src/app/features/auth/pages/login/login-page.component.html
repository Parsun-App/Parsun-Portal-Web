<div class="min-h-screen flex flex-col lg:flex-row bg-surface-0 dark:bg-surface-950">
  <!-- Left panel: branding -->
  <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden bg-zinc-950">
    <div class="absolute inset-0 bg-gradient-to-br from-zinc-900 via-zinc-950 to-zinc-900"></div>
    <div class="relative z-10 flex flex-col justify-center items-center px-16 text-center w-full">
      <div class="bg-white rounded-2xl p-6 shadow-2xl mb-8">
        <img src="/Parsun.png" alt="Parsun" class="h-14 w-auto" />
      </div>
      <h2 class="text-3xl font-bold text-white tracking-tight mb-3">Portal de Clientes</h2>
      <p class="text-zinc-400 max-w-sm">
        Gestiona tus cotizaciones, órdenes, facturas y pagos desde un solo lugar.
      </p>
      <div class="flex gap-6 mt-8 text-zinc-400">
        <div class="flex items-center gap-2"><i class="pi pi-check-circle text-green-500"></i><span class="text-sm">Cotizaciones</span></div>
        <div class="flex items-center gap-2"><i class="pi pi-check-circle text-green-500"></i><span class="text-sm">Órdenes</span></div>
        <div class="flex items-center gap-2"><i class="pi pi-check-circle text-green-500"></i><span class="text-sm">Pagos</span></div>
      </div>
    </div>
  </div>

  <!-- Right panel: login form -->
  <div class="flex-1 flex items-center justify-center p-6 sm:p-12">
    <div class="w-full max-w-md">
      <!-- Mobile/tablet logo -->
      <div class="lg:hidden text-center mb-8">
        <img src="/Parsun.png" alt="Parsun" class="h-14 w-auto mx-auto mb-3" />
        <p class="text-surface-500 text-sm">Portal de Clientes</p>
      </div>

      <div class="bg-surface-0 dark:bg-surface-800 rounded-2xl shadow-lg dark:shadow-2xl p-8 border border-surface-200 dark:border-surface-700">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-bold text-surface-900 dark:text-surface-100">Iniciar Sesión</h1>
          <p class="text-surface-500 text-sm mt-1">Ingresa con tu RIF y contraseña</p>
        </div>

        @if (error()) {
          <div class="mb-4 p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl text-red-700 dark:text-red-300 text-sm flex items-center gap-2">
            <i class="pi pi-exclamation-triangle"></i>
            {{ error() }}
          </div>
        }

        <div class="flex flex-col gap-5">
          <div>
            <label class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-1.5" for="rif">RIF</label>
            <div class="relative">
              <i class="pi pi-id-card absolute left-3 top-1/2 -translate-y-1/2 text-surface-400 text-sm"></i>
              <input
                id="rif"
                pInputText
                [ngModel]="rif()"
                (ngModelChange)="rif.set($event)"
                placeholder="J-12345678-9"
                class="w-full pl-10"
                autocomplete="username"
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-1.5" for="password">Contraseña</label>
            <div class="relative">
              <i class="pi pi-lock absolute left-3 top-1/2 -translate-y-1/2 text-surface-400 text-sm"></i>
              <input
                id="password"
                pInputText
                type="password"
                [ngModel]="password()"
                (ngModelChange)="password.set($event)"
                placeholder="••••••••"
                class="w-full pl-10"
                (keyup.enter)="login()"
                autocomplete="current-password"
              />
            </div>
          </div>

          <p-button
            label="Iniciar Sesión"
            icon="pi pi-sign-in"
            [loading]="loading()"
            (click)="login()"
            styleClass="w-full mt-1"
            [raised]="true"
          />
        </div>
      </div>

      <p class="text-center text-xs text-surface-400 mt-6">
        &copy; 2026 Parsun. Todos los derechos reservados.
      </p>
    </div>
  </div>
</div>
