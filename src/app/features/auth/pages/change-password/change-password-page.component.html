<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <p-card styleClass="w-full max-w-md shadow-lg">
    <ng-template pTemplate="title">
      <div class="text-center text-xl font-semibold">Cambiar contraseña</div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="changePassword()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label for="currentPassword" class="text-sm font-medium text-gray-700"
          >Contraseña actual</label
        >
        <p-password
          id="currentPassword"
          formControlName="currentPassword"
          styleClass="w-full"
          inputStyleClass="w-full"
          [feedback]="false"
          [toggleMask]="true"
          placeholder="Contraseña actual"
          autocomplete="current-password"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="newPassword" class="text-sm font-medium text-gray-700">Nueva contraseña</label>
        <p-password
          id="newPassword"
          formControlName="newPassword"
          styleClass="w-full"
          inputStyleClass="w-full"
          [feedback]="false"
          [toggleMask]="true"
          placeholder="Nueva contraseña"
          autocomplete="new-password"
        />
        @if (newPasswordError()) {
          <small class="text-red-500">{{ newPasswordError() }}</small>
        }
      </div>

      <div class="flex flex-col gap-1">
        <label for="confirmPassword" class="text-sm font-medium text-gray-700"
          >Confirmar contraseña</label
        >
        <p-password
          id="confirmPassword"
          formControlName="confirmPassword"
          styleClass="w-full"
          inputStyleClass="w-full"
          [feedback]="false"
          [toggleMask]="true"
          placeholder="Repetir nueva contraseña"
          autocomplete="new-password"
        />
        @if (form.hasError('passwordsMismatch') && form.get('confirmPassword')?.touched) {
          <small class="text-red-500">Las contraseñas no coinciden</small>
        }
      </div>

      @if (error()) {
        <p-message severity="error" [text]="error()!" styleClass="w-full" />
      }

      @if (success()) {
        <p-message
          severity="success"
          text="Contraseña actualizada correctamente"
          styleClass="w-full"
        />
      }

      <p-button
        type="submit"
        label="Cambiar contraseña"
        styleClass="w-full"
        [loading]="loading()"
        [disabled]="form.invalid"
      />
    </form>
  </p-card>
</div>
