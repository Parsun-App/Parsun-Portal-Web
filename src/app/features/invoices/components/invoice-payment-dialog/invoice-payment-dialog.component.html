<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: 'min(34rem, calc(100vw - 2rem))' }" [draggable]="false" [closable]="!processing()">
  <ng-template pTemplate="header"><div class="flex items-center gap-3"><i [class]="debtPayment() ? 'pi pi-wallet' : 'pi pi-credit-card'"></i><div><h2 class="text-lg font-semibold">{{ debtPayment() ? 'Pagar deuda total' : 'Pagar factura' }}</h2><p class="text-xs text-surface-500">Registra el pago y su comprobante</p></div></div></ng-template>
  <div class="flex flex-col gap-6"><div class="rounded-xl border border-surface-200 bg-surface-50 p-4"><p class="text-xs font-medium uppercase text-surface-500">{{ debtPayment() ? 'Deuda total' : 'Saldo pendiente' }}</p><p class="mt-1 text-2xl font-bold">{{ fullAmount() | currency:'USD':'symbol' }}</p></div>
    <div class="flex flex-col gap-4"><div><label class="text-sm font-medium">Monto a pagar</label><p-inputNumber [(ngModel)]="amount" [min]="0.01" [max]="fullAmount()" mode="currency" currency="USD" locale="en-US" styleClass="w-full" inputStyleClass="w-full" /></div><div class="grid gap-4 sm:grid-cols-2"><div><label class="text-sm font-medium">Método de pago</label><p-select [options]="paymentMethods()" [(ngModel)]="methodId" optionLabel="name" optionValue="id" styleClass="w-full" /></div><div><label class="text-sm font-medium">Fecha de pago</label><p-datepicker [(ngModel)]="paymentDate" dateFormat="dd/mm/yy" styleClass="w-full" /></div></div></div>
    <div class="flex flex-col gap-4"><div><label class="text-sm font-medium">Referencia</label><input pInputText [(ngModel)]="reference" class="w-full" /></div><div><label class="text-sm font-medium">Archivo</label><p-fileupload mode="basic" accept="image/*,.pdf" [maxFileSize]="10000000" (onSelect)="fileSelected.emit($event)" chooseLabel="Adjuntar comprobante" /></div></div>
  </div>
  <ng-template pTemplate="footer"><p-button label="Cancelar" severity="secondary" [outlined]="true" (click)="visible.set(false)" [disabled]="processing()" /><p-button label="Registrar pago" icon="pi pi-check" [loading]="processing()" [disabled]="!valid()" (click)="submitted.emit()" /></ng-template>
</p-dialog>
