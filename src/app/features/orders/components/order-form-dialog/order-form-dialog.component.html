<p-dialog
  [(visible)]="visible"
  [header]="(editing() ? 'Editar ' : 'Nuevo ') + entityLabel()"
  [modal]="true"
  [style]="{ width: 'min(42rem, calc(100vw - 2rem))' }"
  [draggable]="false"
  [appendTo]="'body'"
>
  <div class="flex flex-col gap-4">
    <div>
      <div class="mb-2 flex items-center justify-between">
        <label class="text-sm font-medium">Líneas</label
        ><p-button
          label="Agregar línea"
          icon="pi pi-plus"
          size="small"
          severity="secondary"
          [text]="true"
          (click)="lineAdded.emit()"
        />
      </div>
      <div class="flex flex-col gap-3">
        @for (line of lines(); track $index; let index = $index) {
          <div class="rounded-lg border border-surface-200 p-3">
            <div class="mb-2 flex items-center justify-between">
              <span class="text-xs text-surface-500">Línea {{ index + 1 }}</span>
              @if (lines().length > 1) {
                <p-button
                  icon="pi pi-trash"
                  size="small"
                  severity="danger"
                  [text]="true"
                  (click)="lineRemoved.emit(index)"
                />
              }
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div class="col-span-2">
                <label class="text-xs text-surface-500">Producto</label
                ><p-autocomplete
                  [ngModel]="line.product"
                  (ngModelChange)="productChanged.emit({ lineIndex: index, product: $event })"
                  (completeMethod)="productsSearched.emit({ event: $event, lineIndex: index })"
                  [suggestions]="suggestions()"
                  optionLabel="name"
                  [dropdown]="true"
                  [minLength]="0"
                  styleClass="w-full"
                  inputStyleClass="w-full text-sm"
                  ><ng-template let-product pTemplate="item"
                    ><div class="flex w-full justify-between">
                      <span
                        >{{ product.name }} <small>({{ product.code }})</small></span
                      ><span>{{ product.price | currency: 'USD' : 'symbol' }}</span>
                    </div></ng-template
                  ></p-autocomplete
                >
              </div>
              <div>
                <label class="text-xs text-surface-500">Cantidad</label
                ><p-inputNumber
                  [ngModel]="line.quantity"
                  (ngModelChange)="quantityChanged.emit({ lineIndex: index, quantity: $event })"
                  [min]="0.0001"
                  styleClass="w-full"
                  inputStyleClass="w-full text-sm"
                />
              </div>
              <div>
                <label class="text-xs text-surface-500">Precio Unit.</label
                ><input
                  pInputText
                  [value]="line.unitPrice | currency: 'USD' : 'symbol'"
                  readonly
                  class="w-full text-sm"
                />
              </div>
            </div>
          </div>
        }
      </div>
    </div>
    <div class="flex justify-end border-t pt-3 text-lg font-bold">
      Total: {{ total() | currency: 'USD' : 'symbol' }}
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Notas</label
      ><textarea pInputTextarea [(ngModel)]="notes" rows="2" class="w-full"></textarea>
    </div>
  </div>
  <ng-template pTemplate="footer"
    ><p-button
      label="Cancelar"
      severity="secondary"
      [text]="true"
      (click)="visible.set(false)" /><p-button
      [label]="editing() ? 'Guardar cambios' : 'Guardar borrador'"
      [loading]="creating()"
      [disabled]="!valid()"
      (click)="submitted.emit()"
  /></ng-template>
</p-dialog>
