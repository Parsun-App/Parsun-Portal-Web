<p-dialog header="Cambiar Contraseña" [(visible)]="visible" (onShow)="reset()" [modal]="true" [style]="{ width: 'min(28rem, calc(100vw - 2rem))' }" [draggable]="false">
  <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1"><label for="currentPwd" class="text-sm font-medium">Contraseña actual</label><p-password inputId="currentPwd" formControlName="currentPassword" styleClass="w-full" inputStyleClass="w-full" [feedback]="false" [toggleMask]="true" autocomplete="current-password" /></div>
    <div class="flex flex-col gap-1"><label for="newPwd" class="text-sm font-medium">Nueva contraseña</label><p-password inputId="newPwd" formControlName="newPassword" styleClass="w-full" inputStyleClass="w-full" [feedback]="false" [toggleMask]="true" autocomplete="new-password" />@if (newPasswordError()) { <small class="text-red-500">{{ newPasswordError() }}</small> }</div>
    <div class="flex flex-col gap-1"><label for="confirmPwd" class="text-sm font-medium">Confirmar contraseña</label><p-password inputId="confirmPwd" formControlName="confirmPassword" styleClass="w-full" inputStyleClass="w-full" [feedback]="false" [toggleMask]="true" autocomplete="new-password" />@if (passwordForm.hasError('passwordsMismatch') && passwordForm.controls.confirmPassword.touched) { <small class="text-red-500">Las contraseñas no coinciden</small> }</div>
    @if (passwordError()) { <p-message severity="error" [text]="passwordError()!" styleClass="w-full" /> }
    @if (passwordSuccess()) { <p-message severity="success" text="Contraseña actualizada correctamente" styleClass="w-full" /> }
    <p-button type="submit" label="Cambiar contraseña" styleClass="w-full" [loading]="changingPassword()" [disabled]="passwordForm.invalid" />
  </form>
</p-dialog>
