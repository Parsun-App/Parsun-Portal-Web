<div
  [class]="
    compact()
      ? 'flex flex-col items-center justify-center py-10 text-surface-400 gap-3'
      : 'flex flex-col items-center justify-center h-64 text-surface-400 gap-3'
  "
>
  <div
    class="w-20 h-20 rounded-full bg-surface-100 dark:bg-surface-800 flex items-center justify-center"
  >
    <i [class]="icon()" class="text-3xl text-surface-400"></i>
  </div>
  <h3 class="text-lg font-semibold text-surface-700 dark:text-surface-300">{{ title() }}</h3>
  @if (message()) {
    <p class="text-sm text-surface-500 text-center px-4">{{ message() }}</p>
  }
  @if (actionLabel() && action()) {
    <p-button [label]="actionLabel()" size="small" (onClick)="action()!()" />
  }
</div>
