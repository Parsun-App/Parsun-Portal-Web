<article class="group relative overflow-hidden rounded-xl border border-surface-200 bg-surface-0 p-5 shadow-md transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl dark:border-surface-700 dark:bg-surface-800">
  <div class="absolute right-0 top-0 h-20 w-20 translate-x-1/3 -translate-y-1/3 rounded-full opacity-5 transition-opacity group-hover:opacity-10" [style.background]="gradient()"></div>
  <div class="flex items-start justify-between">
    <div>
      <p class="text-2xl font-bold tracking-tight text-surface-900 dark:text-surface-100">
        @if (currency()) {
          {{ value() | currency:'USD':'symbol':'1.2-2' }}
        } @else {
          {{ value() }}
        }
      </p>
      <p class="mt-1 text-xs font-medium text-surface-500">{{ label() }}</p>
    </div>
    <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-lg text-white" [style.background]="gradient()">
      <i [class]="icon()" aria-hidden="true"></i>
    </div>
  </div>
</article>
