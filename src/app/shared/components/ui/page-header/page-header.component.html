<header class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
  <div class="flex items-center gap-3">
    <div
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-surface-900 text-white dark:bg-surface-100 dark:text-surface-900"
      [style.background]="background() || null"
      [style.color]="color() || null"
    >
      <i [class]="icon() + ' text-lg'" aria-hidden="true"></i>
    </div>
    <div>
      <h1 class="text-2xl font-bold text-surface-900 dark:text-surface-100">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="mt-1 text-surface-500">{{ subtitle() }}</p>
      }
    </div>
  </div>
  <div class="shrink-0">
    <ng-content />
  </div>
</header>
