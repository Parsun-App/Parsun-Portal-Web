<header
  class="flex items-center justify-between h-16 px-4 md:px-6 bg-surface-0 dark:bg-surface-900 border-b border-surface-200 dark:border-surface-700"
>
  <img src="/parsun-logo.png" alt="Parsun" class="h-7 w-auto" />
  <div class="flex items-center gap-1">
    <app-notification-bell />
    <button
      type="button"
      aria-label="Abrir menú de perfil"
      (click)="toggleUserMenu($event)"
      class="ml-1 flex cursor-pointer items-center gap-2 rounded-full border-0 bg-transparent p-1 pr-2 transition-colors hover:bg-surface-100 dark:hover:bg-surface-800"
    >
      <span
        class="flex h-8 w-8 items-center justify-center rounded-full bg-surface-900 text-xs font-bold text-white dark:bg-surface-100 dark:text-surface-900"
      >
        {{ initials() }}
      </span>
      <i class="pi pi-chevron-down text-xs text-surface-500 dark:text-surface-400"></i>
    </button>
  </div>
</header>

<p-popover #userMenu [appendTo]="'body'">
  <div class="min-w-[240px] p-2">
    <div
      class="flex items-center gap-3 border-b border-surface-200 px-2 pb-3 dark:border-surface-700"
    >
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-surface-900 text-sm font-bold text-white dark:bg-surface-100 dark:text-surface-900"
      >
        {{ initials() }}
      </span>
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold text-surface-900 dark:text-surface-100">
          {{ currentUser()?.legalName || 'Cliente' }}
        </p>
        <p class="truncate text-xs text-surface-500 dark:text-surface-400">
          {{ currentUser()?.rif || '' }}
        </p>
      </div>
    </div>
    <div class="flex flex-col gap-1 pt-2">
      <button
        type="button"
        (click)="goToProfile()"
        class="flex w-full cursor-pointer items-center gap-3 rounded-lg border-0 bg-transparent p-3 text-left text-surface-700 transition-colors hover:bg-surface-100 dark:text-surface-200 dark:hover:bg-surface-800"
      >
        <i class="pi pi-user text-surface-600 dark:text-surface-400"></i>
        <span class="font-medium">Mi perfil</span>
      </button>
      <div
        class="flex items-center justify-between gap-3 rounded-lg p-3 text-surface-700 dark:text-surface-200"
      >
        <div class="flex items-center gap-3">
          <i
            [class]="isDarkMode() ? 'pi pi-moon' : 'pi pi-sun'"
            class="text-surface-600 dark:text-surface-400"
          ></i>
          <span class="font-medium">Modo oscuro</span>
        </div>
        <p-toggleswitch [ngModel]="isDarkMode()" (ngModelChange)="setDarkMode($event)" />
      </div>
      <button
        type="button"
        (click)="logout()"
        class="flex w-full cursor-pointer items-center gap-3 rounded-lg border-0 bg-transparent p-3 text-left text-red-600 transition-colors hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-900/20"
      >
        <i class="pi pi-sign-out"></i>
        <span class="font-medium">Cerrar sesión</span>
      </button>
    </div>
  </div>
</p-popover>
